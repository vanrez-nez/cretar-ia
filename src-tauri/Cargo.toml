[package]
name = "cretar-ia"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
hound = "3.5"
voice_activity_detector = "0.2.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-core = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
jsonschema = "0.18"
dirs = "6.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
log = "0.4"
chrono = "0.4"
uuid = { version = "1.23.1", features = ["v4"] }
arboard = "3.4"
rdev = "0.5"
rodio = "0.17"
resvg = { version = "0.47", optional = true }
tauri = { version = "2", optional = true, features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
tauri-plugin-macos-permissions = "2"

[features]
tray = ["tauri", "resvg"]
settings-ui = ["tauri"]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "app_lib"
path = "src/lib.rs"

[[bin]]
name = "cretar-ia"
path = "src/main.rs"
