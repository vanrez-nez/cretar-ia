[[permission]]
identifier = "settings-ui-commands"
description = "Allows settings UI configuration commands."
commands.allow = [
  "get_config_path",
  "apply_settings",
  "open_config_file",
  "list_input_devices",
  "list_sound_options",
  "import_custom_sound",
  "preview_sound",
  "list_model_settings",
  "refresh_provider_models",
  "save_model_item",
  "delete_model_item",
  "select_model",
  "check_permissions",
  "request_microphone_permission",
  "request_accessibility_permission",
]
